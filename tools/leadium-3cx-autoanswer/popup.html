<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px/1.4 system-ui, sans-serif; margin: 0; padding: 12px; width: 340px; color: #1f2937; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    label { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; }
    small { color: #6b7280; }
    ol { list-style: none; padding: 0; margin: 8px 0 0; max-height: 260px; overflow: auto; border-top: 1px solid #e5e7eb; }
    li { padding: 6px 0; border-bottom: 1px solid #f3f4f6; }
    time { color: #6b7280; margin-right: 6px; }
    button { margin-top: 8px; font: inherit; }
  </style>
</head>
<body>
  <h1>Risposta automatica 3CX</h1>
  <label><input type="checkbox" id="enabled"> <span>Attiva<br><small>Risponde solo al richiamo di un Chiama fatto in Leadium negli ultimi 25 secondi, se il numero corrisponde.</small></span></label>
  <label><input type="checkbox" id="diagnostic"> <span>Modalità diagnostica<br><small>Registra cosa vede senza premere Rispondi.</small></span></label>
  <ol id="events"></ol>
  <button type="button" id="clear">Svuota registro</button>
  <script src="popup.js"></script>
</body>
</html>
